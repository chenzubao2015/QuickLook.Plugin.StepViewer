name: Bug report
description: 报告 CAD 文件无法预览、显示错误或交互异常
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿公开上传包含商业机密的 CAD 文件；必要时请提供可复现问题的简化或脱敏模型。
  - type: input
    id: quicklook-version
    attributes:
      label: QuickLook 版本
      placeholder: 例如 4.5.0
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: 例如 1.4.0
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: 文件格式
      options:
        - STP
        - STEP
        - IGS
        - IGES
        - BREP
    validations:
      required: true
  - type: input
    id: file-size
    attributes:
      label: 文件大小
      placeholder: 例如 25 MB
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请描述操作步骤、实际结果和期望结果。
    validations:
      required: true
  - type: textarea
    id: path
    attributes:
      label: 文件路径特征
      description: 路径中是否包含中文、空格、网络盘或特殊字符？请勿填写敏感目录信息。
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或日志
      description: 可粘贴错误截图或 QuickLook 日志中的相关内容。
